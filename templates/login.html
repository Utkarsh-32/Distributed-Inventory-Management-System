<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Inventory Login</title>

    <link
        rel="stylesheet"
        href="/static/style.css"
    >

</head>

<body>

<div class="page">

    <div class="login-card">

        <h1>
            Distributed Inventory
        </h1>

        <p class="subtitle">
            Management System
        </p>

        {% if error %}

        <div class="alert error">
            {{ error }}
        </div>

        {% endif %}

        <form
            method="post"
            action="/login"
        >

            <label>
                Username
            </label>

            <input
                type="text"
                name="username"
                required
            >

            <label>
                Password
            </label>

            <input
                type="password"
                name="password"
                required
            >

            <button type="submit">
                Login
            </button>

        </form>

        <div class="demo-account">

            <strong>
                Demo accounts
            </strong>

            <p>
                alice / password
            </p>

            <p>
                bob / password
            </p>

        </div>

    </div>

</div>

</body>

</html>
